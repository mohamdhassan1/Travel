name: rahala
description: "Rahala — a travel booking app built with Flutter, Supabase and Firebase Cloud Messaging."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^18.0.2

  # Backend: Supabase (auth, database, storage)
  supabase_flutter: ^2.17.2

  # Push notifications (Firebase is used for FCM only)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.7.0

  # Local notifications (trip reminders; scheduled as absolute UTC instants)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # REST (Open-Meteo weather)
  dio: ^5.11.1

  # UI
  cached_network_image: ^4.0.3
  google_fonts: ^8.2.1
  intl: ^0.20.2

  # Device / platform
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
