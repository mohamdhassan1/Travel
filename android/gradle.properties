org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# The pub cache (plugin Kotlin sources) is on C: while this project is on D:.
# Kotlin incremental compilation can't relativise paths across drive roots on
# Windows ("this and base files have different roots"), so disable it.
kotlin.incremental=false
# Compile Kotlin inside the Gradle daemon instead of a second JVM (lower peak memory).
kotlin.compiler.execution.strategy=in-process
